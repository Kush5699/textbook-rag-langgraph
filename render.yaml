services:
  - type: web
    name: gsstb-scholar
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: FIREBASE_PROJECT_ID
        value: gsstb-scholar-f670e
      - key: CORS_ORIGINS
        value: "*"
      - key: PORT
        value: 8001
